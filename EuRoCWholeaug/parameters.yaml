general: 
  exp_dir: /user/yqiu/data/yuhengq/AirIMU/EuRoC/codenet21Huberp005_covaug_whole
dataset: 
  train: 
    mode: train
    calib: false
    data_list: 
      - 
        name: Euroc
        window_size: 1000
        step_size: 10
        data_root: /user/yqiu/data/euroc
        data_drive: 
          - V1_02_medium
          - V2_01_easy
          - V2_03_difficult
          - MH_03_medium
          - MH_05_difficult
          - MH_01_easy
  test: 
    mode: test
